[package]
name = "rooter"
version = "0.1.0"
edition = "2021"
description = "A CLI toolbelt for developers: why, ship, envcheck, where, stash, doctor"
default-run = "rooter"

[[bin]]
name = "rooter"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
inquire = "0.7"
sysinfo = "0.32"
arboard = "3"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
walkdir = "2"
colored = "2"
humansize = "2"
regex = "1"
which = "6"
netstat2 = "0.11"
open = "5"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
tiny_http = "0.12"
hex = "0.4"
urlencoding = "2"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 2
